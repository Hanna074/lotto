{% extends 'base.html' %}

{% block title %}로그인 - LOTTO{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="auth-card mx-auto">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h3>로그인</h3>
      <p>환영합니다. 오늘도 행운 가득한 하루 되세요!</p>
    </div>
    <div class="auth-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">아이디</label>
          <input type="text" name="username" class="form-control" placeholder="아이디를 입력하세요" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">비밀번호</label>
          <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
        </div>
        {% if form.non_field_errors %}
        <div class="alert alert-danger small">{{ form.non_field_errors }}</div>
        {% endif %}
        <button type="submit" class="btn btn-auth w-100 mt-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>로그인
        </button>
      </form>
      <hr class="my-4">
      <p class="text-center mb-0">계정이 없으신가요? <a href="{% url 'signup' %}" class="link-warning fw-bold">회원가입</a></p>
    </div>
  </div>
</div>
{% endblock %}
